name: events-fsa-dev

x-restart: &restart
  restart: unless-stopped

x-no-tls-env: &no-tls-env
  KAFKA_BROKER: kafka:29092
  KAFKA_SSL_CA_PATH: ""
  KAFKA_SASL_MECHANISM: ""
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
  REDIS_TLS: "false"
  REDIS_TLS_CA_PATH: ""
  REDIS_PASSWORD: ""
  DATABASE_SSL_MODE: disable
  DATABASE_SSL_CA_PATH: ""

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    expose:
      - "5432"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_SUPERUSER_DB:-postgres}
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:-auth_app}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-auth_pass}
      POSTGRES_EVENTS_USER: ${POSTGRES_EVENTS_USER:-events_app}
      POSTGRES_EVENTS_PASSWORD: ${POSTGRES_EVENTS_PASSWORD:-events_pass}
      POSTGRES_NOTIFICATIONS_USER: ${POSTGRES_NOTIFICATIONS_USER:-notif_app}
      POSTGRES_NOTIFICATIONS_PASSWORD: ${POSTGRES_NOTIFICATIONS_PASSWORD:-notif_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-dbs.sql:/docker-entrypoint-initdb.d/00-init-dbs.sql:ro
      - ./scripts/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      backend:
        ipv4_address: 172.30.0.10

  kafka:
    image: apache/kafka:latest
    <<: *restart
    expose:
      - "29092"
      - "29095"
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-QTk1NjcxYjhkZTVkNGU2M}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - kafka_kraft_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      backend:
        ipv4_address: 172.30.0.11

  redis:
    image: redis:7-alpine
    <<: *restart
    expose:
      - "6379"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      backend:
        ipv4_address: 172.30.0.12

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: devops_apigateway_dev
    ports:
      - "3001:${PORT:-3000}"
    env_file: .env
    environment:
      <<: *no-tls-env
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - path: ./apps/api-gateway
          action: rebuild
        - path: ./libs
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./Dockerfile
          action: rebuild

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth
    container_name: devops_auth_dev
    env_file: .env
    environment:
      <<: *no-tls-env
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_DATABASE_URL: postgresql://${POSTGRES_AUTH_USER:-auth_app}:${POSTGRES_AUTH_PASSWORD:-auth_pass}@postgres:5432/auth_db
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - path: ./apps/auth
          action: rebuild
        - path: ./libs
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./Dockerfile
          action: rebuild

  events:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: events
    container_name: devops_events_dev
    env_file: .env
    environment:
      <<: *no-tls-env
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EVENTS_DATABASE_URL: postgresql://${POSTGRES_EVENTS_USER:-events_app}:${POSTGRES_EVENTS_PASSWORD:-events_pass}@postgres:5432/events_db
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - path: ./apps/events
          action: rebuild
        - path: ./libs
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./Dockerfile
          action: rebuild

  notifications:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notifications
    container_name: devops_notifications_dev
    env_file: .env
    environment:
      <<: *no-tls-env
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NOTIFICATIONS_DATABASE_URL: postgresql://${POSTGRES_NOTIFICATIONS_USER:-notif_app}:${POSTGRES_NOTIFICATIONS_PASSWORD:-notif_pass}@postgres:5432/notifications_db
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - path: ./apps/notifications
          action: rebuild
        - path: ./libs
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./Dockerfile
          action: rebuild

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
  kafka_kraft_data:
  redis_data:
