name: CI/CD

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/**'
              - 'libs/**'
              - 'prisma/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - 'nest-cli.json'
              - 'tsconfig*.json'

  test:
    name: Lint, build & test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build all apps
        run: |
          for app in api-gateway auth events events-app notifications; do
            echo "::group::nest build $app"
            npx nest build "$app"
            echo "::endgroup::"
          done

      - name: Unit tests
        run: npm test -- --ci

      - name: E2E tests
        run: npm run test:e2e -- --ci

  migrations-check:
    name: Validate Prisma migrations
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Create per-service databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE auth_db;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE events_db;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE notifications_db;"

      - name: Deploy migrations against a clean database
        run: npm run prisma:migrate:deploy
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_db?schema=public
          EVENTS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/events_db?schema=public
          NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifications_db?schema=public

  docker:
    name: Build & publish images
    needs: [changes, test, migrations-check]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth, events, events-app, notifications]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${{ github.repository_owner }}/events-fsa-${{ matrix.service }}"
          SCAN_TAG="${IMAGE}:sha-${SHA_SHORT}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="$SCAN_TAG"
          else
            TAGS=$(printf '%s\n%s:dev\n%s:latest' "$SCAN_TAG" "$IMAGE" "$IMAGE")
          fi
          {
            echo "tags<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
            echo "scan_tag=$SCAN_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.scan_tag }}
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload vulnerability scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  deploy:
    name: Deploy to server
    needs: docker
    # docker is skipped (not failed) when no app code changed — deploy should
    # still run then, re-pulling the existing :dev images unchanged.
    if: |
      github.event_name == 'push' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Compute host key fingerprint
        id: hostkey
        run: |
          echo "${{ secrets.DEPLOY_HOST_KEY }}" > /tmp/known_hosts_entry
          echo "fingerprint=$(ssh-keygen -lf /tmp/known_hosts_entry | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The repo is public, so the server pulls it straight from GitHub over
      # HTTPS instead of the runner pushing files to it — simpler than rsync
      # and needs no extra auth.
      - name: Pull latest source, images, restart stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /home/runner/.ssh/deploy_key
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: ${{ steps.hostkey.outputs.fingerprint }}
          envs: GHCR_TOKEN,FIREBASE_PROJECT_ID,FIREBASE_PRIVATE_KEY,FIREBASE_CLIENT_EMAIL
          script: |
            set -e
            if [ ! -d /opt/events-fsa/.git ]; then
              # First deploy: clone into a scratch dir and copy in, rather than
              # cloning straight into /opt/events-fsa, so any .env already
              # placed there by the server bootstrap step is left untouched.
              rm -rf /tmp/events-fsa-init
              git clone --quiet --branch dev https://github.com/maikvibes/events-fsa.git /tmp/events-fsa-init
              mkdir -p /opt/events-fsa
              cp -a /tmp/events-fsa-init/. /opt/events-fsa/
              rm -rf /tmp/events-fsa-init
            fi
            cd /opt/events-fsa
            git fetch --quiet origin dev
            git reset --hard origin/dev
            if [ ! -f .env ]; then
              bash scripts/generate-secrets.sh
            fi
            # Firebase creds are real external credentials, not generatable —
            # sourced from GitHub secrets and kept out of the repo entirely.
            # Also strips orphaned PEM body/footer lines left behind by earlier
            # deploys that wrote FIREBASE_PRIVATE_KEY with real (unescaped)
            # newlines — those continuation lines don't start with FIREBASE_*
            # so the first sed alone can't remove them.
            sed -i \
              -e '/^FIREBASE_PROJECT_ID=/d' \
              -e '/^FIREBASE_PRIVATE_KEY=/d' \
              -e '/^FIREBASE_CLIENT_EMAIL=/d' \
              -e '/^-----BEGIN PRIVATE KEY-----/d' \
              -e '/^-----END PRIVATE KEY-----/d' \
              -e '/^[A-Za-z0-9+/]\{20,\}=*$/d' \
              .env
            # .env has no multiline support, so the key's real newlines (however
            # the secret happens to be stored) must become literal \n escapes —
            # the app itself un-escapes them back to real newlines at runtime.
            FIREBASE_PRIVATE_KEY_ESCAPED=$(printf '%s' "$FIREBASE_PRIVATE_KEY" | sed ':a;N;$!ba;s/\n/\\n/g')
            {
              echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
              echo "FIREBASE_PRIVATE_KEY=\"$FIREBASE_PRIVATE_KEY_ESCAPED\""
              echo "FIREBASE_CLIENT_EMAIL=$FIREBASE_CLIENT_EMAIL"
            } >> .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml build migrate
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
