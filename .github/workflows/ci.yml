name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/**'
              - 'libs/**'
              - 'prisma/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - 'nest-cli.json'
              - 'tsconfig*.json'
              - 'frontend/**'
              - 'scripts/generate-sw.mjs'

  test:
    name: Lint, build & test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build all apps
        run: |
          for app in api-gateway auth events events-app notifications; do
            echo "::group::nest build $app"
            npx nest build "$app"
            echo "::endgroup::"
          done

      - name: Unit tests
        run: npm test -- --ci

      - name: E2E tests
        run: npm run test:e2e -- --ci

  migrations-check:
    name: Validate Prisma migrations
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Create per-service databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE auth_db;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE events_db;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE notifications_db;"

      - name: Deploy migrations against a clean database
        run: npm run prisma:migrate:deploy
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_db?schema=public
          EVENTS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/events_db?schema=public
          NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifications_db?schema=public

  docker:
    name: Build & publish images
    needs: [changes, test, migrations-check]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth, events, events-app, notifications, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${{ github.repository_owner }}/events-fsa-${{ matrix.service }}"
          SCAN_TAG="${IMAGE}:sha-${SHA_SHORT}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="$SCAN_TAG"
          else
            TAGS=$(printf '%s\n%s:dev\n%s:latest' "$SCAN_TAG" "$IMAGE" "$IMAGE")
          fi
          {
            echo "tags<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
            echo "scan_tag=$SCAN_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Dockerfile
        id: dockerfile
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "path=./frontend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args=" >> "$GITHUB_OUTPUT"
          else
            echo "path=./Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args=SERVICE_NAME=${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          build-args: ${{ steps.dockerfile.outputs.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.scan_tag }}
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload vulnerability scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
