name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      migrations: ${{ steps.filter.outputs.migrations }}
      services: ${{ steps.services.outputs.services }}
      nest_apps: ${{ steps.services.outputs.nest_apps }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/**'
              - 'libs/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - 'nest-cli.json'
              - 'tsconfig*.json'
              - 'frontend/**'
              - 'scripts/generate-sw.mjs'
            shared: &shared
              - 'libs/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - 'nest-cli.json'
              - 'tsconfig*.json'
            api-gateway:
              - *shared
              - 'apps/api-gateway/**'
            analytics:
              - *shared
              - 'apps/analytics/**'
            auth:
              - *shared
              - 'apps/auth/**'
            events:
              - *shared
              - 'apps/events/**'
            events-app:
              - *shared
              - 'apps/events-app/**'
            notifications:
              - *shared
              - 'apps/notifications/**'
            frontend:
              - 'frontend/**'
              - 'scripts/generate-sw.mjs'
            migrations:
              - 'apps/auth/prisma/**'
              - 'apps/events/prisma/**'
              - 'apps/notifications/prisma/**'
              - 'apps/analytics/prisma/**'
              - 'package.json'
              - 'package-lock.json'

      # Turns the per-service booleans above into two JSON arrays: one for the
      # docker publish matrix (includes frontend), one for `nest build` (does
      # not — frontend isn't a Nest app) — so only what actually changed gets
      # built/published instead of rebuilding all 5 services + frontend on
      # every push.
      - name: Compute changed-service lists
        id: services
        run: |
          nest_apps=()
          [ "${{ steps.filter.outputs['api-gateway'] }}" = "true" ] && nest_apps+=("api-gateway")
          [ "${{ steps.filter.outputs['analytics'] }}" = "true" ] && nest_apps+=("analytics")
          [ "${{ steps.filter.outputs['auth'] }}" = "true" ] && nest_apps+=("auth")
          [ "${{ steps.filter.outputs['events'] }}" = "true" ] && nest_apps+=("events")
          [ "${{ steps.filter.outputs['events-app'] }}" = "true" ] && nest_apps+=("events-app")
          [ "${{ steps.filter.outputs['notifications'] }}" = "true" ] && nest_apps+=("notifications")
          services=("${nest_apps[@]}")
          if [ "${{ steps.filter.outputs['frontend'] }}" = "true" ]; then
            services+=("frontend")
          fi
          nest_json=$(printf '%s\n' "${nest_apps[@]}" | jq -R . | jq -s -c .)
          services_json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s -c .)
          echo "nest_apps=$nest_json" >> "$GITHUB_OUTPUT"
          echo "services=$services_json" >> "$GITHUB_OUTPUT"

  test:
    name: Lint, build & test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      # continue-on-error: a lint failure here previously caused the whole job
      # (and, transitively, the docker publish job) to be skipped — that's how
      # the admin-panel commit silently shipped an api-gateway image with no
      # matching auth/notifications images, since only the *next* commit's
      # (unrelated) path diff triggered their rebuild. Lint issues should be
      # visible, not able to block a deploy.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true

      - name: Build changed apps
        run: |
          apps='${{ needs.changes.outputs.nest_apps }}'
          echo "$apps" | jq -r '.[]' | while read -r app; do
            echo "::group::nest build $app"
            npx nest build "$app"
            echo "::endgroup::"
          done

      - name: Unit tests
        run: npm test -- --ci

      - name: E2E tests
        run: npm run test:e2e -- --ci

  migrations-check:
    name: Validate Prisma migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Create per-service databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE auth_db;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE events_db;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE notifications_db;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE analytics_db;"

      - name: Deploy migrations against a clean database
        run: npm run prisma:migrate:deploy
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_db?schema=public
          EVENTS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/events_db?schema=public
          NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifications_db?schema=public
          ANALYTICS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/analytics_db?schema=public

      # Smoke-test both seeders against the freshly migrated schema: the dev seed
      # (users/events/follows + admin role) and a small bulk load (users + device
      # tokens). Catches schema/seed drift before it reaches a running stack.
      - name: Seed (dev + bulk smoke test)
        run: |
          npm run seed
          npm run seed:load -- 1000 --fresh
        env:
          JWT_SECRET: ci-seed-secret
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_db?schema=public
          EVENTS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/events_db?schema=public
          NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifications_db?schema=public

  docker:
    name: Build & publish images
    needs: [changes, test, migrations-check]
    # migrations-check is conditionally skipped (only runs when prisma/**
    # changed) — treat skipped as passing so it doesn't block image builds
    # when nothing schema-related changed. always() is required up front:
    # GitHub silently prefixes any custom `if:` with success() unless it
    # already starts with a status-check function, and success() is false
    # whenever a needed job (migrations-check) was skipped.
    if: |
      always() &&
      needs.changes.outputs.services != '[]' &&
      needs.test.result == 'success' &&
      (needs['migrations-check'].result == 'success' || needs['migrations-check'].result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      # strategy.matrix is evaluated to plan the job DAG *before* the job-level
      # `if:` above is checked — an empty array here fails the whole workflow
      # ("Matrix must define at least one vector") regardless of that `if:`.
      # The placeholder keeps the matrix non-empty; the job's `if:` (false
      # whenever services is '[]') still ensures nothing actually builds.
      matrix:
        service: ${{ needs.changes.outputs.services != '[]' && fromJson(needs.changes.outputs.services) || fromJson('["noop"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${{ github.repository_owner }}/events-fsa-${{ matrix.service }}"
          SCAN_TAG="${IMAGE}:sha-${SHA_SHORT}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="$SCAN_TAG"
          else
            TAGS=$(printf '%s\n%s:dev\n%s:latest' "$SCAN_TAG" "$IMAGE" "$IMAGE")
          fi
          {
            echo "tags<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
            echo "scan_tag=$SCAN_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Dockerfile
        id: dockerfile
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "path=./frontend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args=VITE_API_BASE_URL=${{ vars.API_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=./Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args=SERVICE_NAME=${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          build-args: ${{ steps.dockerfile.outputs.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.scan_tag }}
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload vulnerability scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
