name: events-fsa

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_SUPERUSER_DB:-postgres}
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:-auth_app}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-auth_pass}
      POSTGRES_EVENTS_USER: ${POSTGRES_EVENTS_USER:-events_app}
      POSTGRES_EVENTS_PASSWORD: ${POSTGRES_EVENTS_PASSWORD:-events_pass}
      POSTGRES_NOTIFICATIONS_USER: ${POSTGRES_NOTIFICATIONS_USER:-notif_app}
      POSTGRES_NOTIFICATIONS_PASSWORD: ${POSTGRES_NOTIFICATIONS_PASSWORD:-notif_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-dbs.sql:/docker-entrypoint-initdb.d/00-init-dbs.sql:ro
      - ./scripts/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-QTk1NjcxYjhkZTVkNGU2M}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - kafka_kraft_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  # Runs from the `builder` stage (has the full source tree) rather than a
  # pulled GHCR image: the final `runner` stage intentionally drops the
  # prisma/ directory to keep the runtime image minimal, so it can't run
  # `prisma migrate deploy` on its own. This is the only piece of the prod
  # stack still built on the server instead of pulled from GHCR.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        SERVICE_NAME: auth
    env_file: .env
    command: ["sh", "-c", "npm run prisma:migrate:deploy"]
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/maikvibes/events-fsa-api-gateway:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "3000:${PORT:-3000}"
    env_file: .env
    environment:
      NODE_ENV: production
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/maikvibes/events-fsa-frontend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - backend

  auth:
    image: ghcr.io/maikvibes/events-fsa-auth:${IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_DATABASE_URL: postgresql://${POSTGRES_AUTH_USER:-auth_app}:${POSTGRES_AUTH_PASSWORD:-auth_pass}@postgres:5432/auth_db
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  events:
    image: ghcr.io/maikvibes/events-fsa-events:${IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EVENTS_DATABASE_URL: postgresql://${POSTGRES_EVENTS_USER:-events_app}:${POSTGRES_EVENTS_PASSWORD:-events_pass}@postgres:5432/events_db
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifications:
    image: ghcr.io/maikvibes/events-fsa-notifications:${IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NOTIFICATIONS_DATABASE_URL: postgresql://${POSTGRES_NOTIFICATIONS_USER:-notif_app}:${POSTGRES_NOTIFICATIONS_PASSWORD:-notif_pass}@postgres:5432/notifications_db
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  backend:

volumes:
  postgres_data:
  kafka_kraft_data:
  redis_data:
